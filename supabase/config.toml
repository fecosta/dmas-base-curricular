project_id = "dmas-base-curricular"

[api]
enabled = true
port = 55321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1:55321"

[local_smtp]
enabled = true
port = 55324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://127.0.0.1:3000/auth/callback"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Social login may create an Auth identity.
# Product access still requires live eligibility rows.
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
# Email provider must remain enabled for OTP fallback.
# The application itself prevents OTP signup with shouldCreateUser=false.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 600

[auth.email.template.magic_link]
subject = "Tu código de acceso a D+ Base Curricular"
content_path = "./supabase/templates/login-code.html"

[analytics]
enabled = false